appId: com.apisense.app
name: Varios cuadros notas largas y paginacion de lecturas
---
- launchApp
- openLink: apisense:///
- scrollUntilVisible:
    element: { text: "Explorar demo local" }
- tapOn: "Explorar demo local"
- extendedWaitUntil:
    visible: "Datos de demostración · Sin envío a nube"
    timeout: 60000
- openLink: apisense:///ui-catalog
- scrollUntilVisible:
    element: { text: "Claro" }
- tapOn: "Claro"
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- scrollUntilVisible:
    element: { id: "cycle-label" }
- tapOn: { id: "cycle-label" }
- inputText: QA Lote A
- hideKeyboard
- tapOn: { id: "cycle-start" }
- eraseText: 50
- inputText: ${CYCLE_START}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element: { text: "Iniciar seguimiento de cría" }
- tapOn: "Iniciar seguimiento de cría"
- scrollUntilVisible:
    element: { text: "Seguimiento guardado en este dispositivo" }
- scrollUntilVisible:
    direction: UP
    centerElement: true
    element: { id: "brood-cycle-ring" }
- tapOn: { id: "brood-cycle-ring" }
- scrollUntilVisible:
    element: { id: "cycle-label" }
- tapOn: { id: "cycle-label" }
- eraseText: 100
- inputText: QA Lote A editado
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element: { text: "Guardar cambios del ciclo" }
- tapOn: "Guardar cambios del ciclo"
- scrollUntilVisible:
    element: { text: "Seguimiento guardado en este dispositivo" }
- scrollUntilVisible:
    # The preceding success message is below this action in the cycle card.
    direction: UP
    centerElement: true
    element: { text: "Iniciar otro cuadro o lote" }
- tapOn: "Iniciar otro cuadro o lote"
- scrollUntilVisible:
    element: { id: "cycle-label" }
- tapOn: { id: "cycle-label" }
- inputText: QA Lote B
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element: { text: "Iniciar seguimiento de cría" }
- tapOn: "Iniciar seguimiento de cría"
- scrollUntilVisible:
    element: { text: "Seguimiento guardado en este dispositivo" }
- scrollUntilVisible:
    direction: UP
    centerElement: true
    element: { text: "Día 1" }
- takeScreenshot: .artifacts/design/extended/01-multiple-cohorts
- scrollUntilVisible:
    direction: UP
    element: { text: "QA Lote A editado ·.*" }
- tapOn: "QA Lote A editado ·.*"
- scrollUntilVisible:
    centerElement: true
    element: { text: "Día 16" }
- assertVisible: "QA Lote A editado"
- takeScreenshot: .artifacts/design/extended/02-selected-older-cohort
- scrollUntilVisible:
    centerElement: true
    element: { text: "Detener seguimiento" }
- tapOn: "Detener seguimiento"
- assertVisible: "¿Detener este seguimiento?"
- tapOn: { text: "^Volver$" }
- assertVisible: "Detener seguimiento"
- tapOn: "Detener seguimiento"
- tapOn: { text: "^Detener$" }
- scrollUntilVisible:
    element: { text: "Seguimiento detenido; registro conservado" }
- scrollUntilVisible:
    direction: UP
    centerElement: true
    element: { text: "Seguimiento detenido; historial conservado." }
- takeScreenshot: .artifacts/design/extended/03-stopped-history
- openLink: apisense:///inspection?hiveId=00000000-0000-4000-8000-000000000102
- assertVisible: "Observaciones de Colmena 02"
- tapOn: { id: inspection-notes }
- inputText: "QA nota larga inicial. Revision de cuadros, cria y reservas. Se describe lo observado en campo sin deducir un diagnostico del audio. Se revisaron entradas, ventilacion y alimentacion. La reina solo se marca si se ve directamente. Se conservaron las observaciones de este lote para comparar con la siguiente visita. Esta nota comprueba que el texto extenso se puede escribir, desplazar, guardar y consultar de nuevo. La ausencia de una medicion no se sustituye por un dato sintetico. FINAL NOTA LARGA QA."
- takeScreenshot: .artifacts/design/extended/04-long-note-keyboard
- hideKeyboard
- scrollUntilVisible:
    element: { text: "Guardar inspección" }
- tapOn: "Guardar inspección"
- scrollUntilVisible:
    element: { text: "Inspección de demo guardada localmente." }
- repeat:
    times: 6
    commands:
      - openLink: apisense:///inspection?hiveId=00000000-0000-4000-8000-000000000102
      - tapOn: { id: inspection-notes }
      - inputText: QA visita adicional para consultar observaciones anteriores
      - hideKeyboard
      - scrollUntilVisible:
          element: { text: "Guardar inspección" }
      - tapOn: "Guardar inspección"
      - scrollUntilVisible:
          element: { text: "Inspección de demo guardada localmente." }
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- scrollUntilVisible:
    # This control is near the bottom; centering it is physically impossible.
    # Require full visibility, then verify the older saved note after tapping.
    timeout: 60000
    element: { text: "Ver observaciones anteriores" }
- tapOn: "Ver observaciones anteriores"
- scrollUntilVisible:
    timeout: 60000
    element: { text: ".*FINAL NOTA LARGA QA.*" }
- takeScreenshot: .artifacts/design/extended/05-older-long-note
- openLink: apisense:///monitor?hiveId=00000000-0000-4000-8000-000000000102
- scrollUntilVisible:
    element: { text: "Simular muestra de 5 segundos" }
- repeat:
    times: 11
    commands:
      - tapOn: "Simular muestra de 5 segundos"
      - extendedWaitUntil:
          visible: { text: "Simular muestra de 5 segundos", enabled: true }
          timeout: 60000
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- scrollUntilVisible:
    centerElement: true
    element: { text: 'Ver lecturas guardadas \(12\)' }
- tapOn: 'Ver lecturas guardadas \(12\)'
- scrollUntilVisible:
    centerElement: true
    timeout: 60000
    element: { text: "Mostrar más lecturas" }
- tapOn: "Mostrar más lecturas"
- scrollUntilVisible:
    centerElement: true
    element: { text: "Abrir lectura 12" }
- takeScreenshot: .artifacts/design/extended/06-reading-pagination
- tapOn: "Abrir lectura 12"
- assertVisible: "Lectura seleccionada del historial"
- scrollUntilVisible:
    centerElement: true
    element: { text: "Escuchar zumbido" }
- tapOn: "Escuchar zumbido"
- assertVisible: "Audio en reproducción"
- takeScreenshot: .artifacts/design/extended/07-oldest-reading-playing
- tapOn: "Detener audio"
- assertVisible: "Audio detenido"
