appId: com.apisense.app
name: App de campo Android con cuentas Supabase y sincronización
---
- launchApp
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Comenzar"
- tapOn: "Comenzar"
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_QA_A_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "login-password"
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_QA_A_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Entrar al Apiario"
- tapOn: "Entrar al Apiario"
- extendedWaitUntil:
    visible: "(Buenos días|Buenas tardes|Buenas noches), apicultor"
    timeout: 60000
- assertNotVisible: "Datos de demostración · Sin envío a nube"
- tapOn:
    id: "nav-Colmenas"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Abrir QA-CAMPO-15"
    timeout: 60000
- takeScreenshot: .artifacts/field-account-a
- tapOn:
    id: "nav-Ajustes"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Modo sin conexión"
- tapOn:
    id: "offline-toggle"
- tapOn:
    id: "nav-Colmenas"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Abrir QA-CAMPO-15"
- tapOn: "Abrir QA-CAMPO-15"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Anotar"
- tapOn: "Anotar"
- tapOn:
    id: "inspection-notes"
- inputText: ${MAESTRO_QA_NOTE}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Guardar observación"
- tapOn: "Guardar observación"
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Observación guardada en este dispositivo.*"
- stopApp
