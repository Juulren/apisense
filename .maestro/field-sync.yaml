appId: com.apisense.app
---
- launchApp
- extendedWaitUntil:
    visible: "(Buenos días|Buenas tardes|Buenas noches), apicultor"
    timeout: 60000
- tapOn:
    id: "nav-Ajustes"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "offline-toggle"
# The observation made offline is still waiting: without this, the wait below
# could pass without anything having been sent.
- assertVisible: "[0-9]+ sin enviar"
# Turning "Sin conexión" off starts a sync. Pulling down is not covered here.
- tapOn:
    id: "offline-toggle"
- extendedWaitUntil:
    notVisible: ".*sin enviar.*"
    timeout: 60000
- assertNotVisible: "No se pudo actualizar.*"
- takeScreenshot: .artifacts/field-synchronized
- scrollUntilVisible:
    centerElement: false
    element:
      id: "logout"
- tapOn:
    id: "logout"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "logout-confirm"
- tapOn:
    id: "logout-confirm"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "login-email"
    timeout: 60000
- stopApp
- launchApp
- scrollUntilVisible:
    centerElement: false
    element:
      id: "login-email"
- assertNotVisible: "(Buenos días|Buenas tardes|Buenas noches), apicultor"
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_QA_B_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "login-password"
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_QA_B_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "login-submit"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "(Buenos días|Buenas tardes|Buenas noches), apicultor"
    timeout: 60000
- tapOn:
    id: "nav-Colmenas"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Abrir B-PRIVADA-15"
    timeout: 60000
- assertNotVisible: "Abrir QA-CAMPO-15"
- takeScreenshot: .artifacts/field-account-b
- tapOn:
    id: "nav-Ajustes"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "logout"
- tapOn:
    id: "logout"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "logout-confirm"
- tapOn:
    id: "logout-confirm"
