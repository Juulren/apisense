appId: com.apisense.demo
name: Demo nativa offline y persistencia
---
# The platform scripts install/reset the demo before this flow. On iOS,
# Maestro clearState reinstalls a copy and loses the simulator signature.
- launchApp
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Entrar a la demo"
- assertVisible: "Entrar a la demo"
- tapOn: "Entrar a la demo"
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- takeScreenshot: .artifacts/demo-dashboard
- tapOn:
    id: "nav-Colmenas"
- extendedWaitUntil:
    visible: "Buscar colmena"
    timeout: 15000
- tapOn: "Mapa"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Ubicación de referencia · Demo"
- takeScreenshot: .artifacts/demo-map
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Abrir Colmena 01"
- tapOn: "Abrir Colmena 01"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Anotar"
- tapOn: "Anotar"
- tapOn:
    id: "inspection-notes"
- inputText: "Inspeccion de prueba nativa persistente"
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Guardar observación"
- tapOn: "Guardar observación"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Observación de demo guardada localmente."
- assertVisible: "Observación de demo guardada localmente."
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Volver"
- tapOn: "Volver"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Inspeccion de prueba nativa persistente"
- takeScreenshot: .artifacts/demo-inspection
- stopApp
- launchApp
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Entrar a la demo"
- tapOn: "Entrar a la demo"
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- tapOn:
    id: "nav-Colmenas"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Abrir Colmena 01"
- tapOn: "Abrir Colmena 01"
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Inspeccion de prueba nativa persistente"
- takeScreenshot: .artifacts/demo-reopened
- tapOn:
    id: "nav-Ajustes"
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Salir de la demo"
- tapOn: "Salir de la demo"
- scrollUntilVisible:
    centerElement: false
    element:
      text: "Entrar a la demo"
- assertVisible: "Entrar a la demo"
