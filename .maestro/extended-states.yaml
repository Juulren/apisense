appId: com.apisense.app
name: Mapa errores y colmena sin lecturas
---
- openLink: apisense:///hives
- extendedWaitUntil:
    visible: "Buscar colmena"
    timeout: 30000
- tapOn: { text: "^Mapa$" }
- scrollUntilVisible:
    centerElement: true
    element: { id: "demo-map" }
- takeScreenshot: .artifacts/design/states/01-local-map
- scrollUntilVisible:
    direction: UP
    element: { text: "Nombre o código" }
- tapOn: "Nombre o código"
- inputText: zzz-no-existe
- hideKeyboard
- scrollUntilVisible:
    element: { text: "No hay colmenas para esta búsqueda." }
- takeScreenshot: .artifacts/design/states/02-empty-search
- scrollUntilVisible:
    element: { text: "Añadir colmena" }
- tapOn: "Añadir colmena"
- scrollUntilVisible:
    element: { text: "Colmena 09" }
- tapOn: "Colmena 09"
- inputText: QA sin lecturas
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element: { text: "Guardar colmena" }
- tapOn: "Guardar colmena"
- scrollUntilVisible:
    element: { text: "Colmena guardada localmente" }
- scrollUntilVisible:
    direction: UP
    element: { text: "zzz-no-existe" }
- tapOn: "zzz-no-existe"
- eraseText: 100
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element: { text: "Abrir QA sin lecturas" }
- tapOn: "Abrir QA sin lecturas"
- scrollUntilVisible:
    direction: UP
    element: { text: "Anotar" }
- tapOn: "Anotar"
- scrollUntilVisible:
    element: { id: "inspection-save" }
- tapOn: { id: "inspection-save" }
- scrollUntilVisible:
    element: { text: "Escribe una nota de al menos 3 caracteres o elige cómo la ves" }
- takeScreenshot: .artifacts/design/states/04-inspection-validation
- openLink: apisense:///inspection?hiveId=00000000-0000-4000-8000-000000009999
- scrollUntilVisible:
    direction: UP
    element: { text: "Elige la colmena" }
- scrollUntilVisible:
    element: { id: "inspection-save" }
- assertVisible: { id: "inspection-save", enabled: false }
- takeScreenshot: .artifacts/design/states/05-invalid-hive-disabled
