appId: com.apisense.app
name: Formulario con texto al 200 por ciento
---
- launchApp
- openLink: apisense:///
- scrollUntilVisible:
    element: { text: "Explorar demo local" }
- tapOn: "Explorar demo local"
- extendedWaitUntil:
    visible: "Datos de demostración · Sin envío a nube"
    timeout: 60000
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- openLink: apisense:///inspection?hiveId=00000000-0000-4000-8000-000000000102
- scrollUntilVisible:
    direction: UP
    element: { text: "Observaciones de Colmena 02" }
- takeScreenshot: .artifacts/design/font200/03-hive-options
- scrollUntilVisible:
    centerElement: true
    element: { id: "inspection-notes" }
- tapOn: { id: "inspection-notes" }
- inputText: Texto grande con teclado y observacion de campo
- takeScreenshot: .artifacts/design/font200/04-notes-keyboard
- hideKeyboard
- scrollUntilVisible:
    element: { text: "Guardar observación" }
- takeScreenshot: .artifacts/design/font200/05-save-reachable
