appId: com.apisense.app
name: Observaciones y lecturas por colmena
---
- openLink: apisense:///
- scrollUntilVisible:
    element: { id: "login-demo" }
- tapOn: { id: "login-demo" }
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- openLink: apisense:///ui-catalog
- scrollUntilVisible:
    element: { text: "Claro" }
- tapOn: "Claro"
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000101
- scrollUntilVisible:
    direction: UP
    element: { text: "Anotar" }
- tapOn: "Anotar"
- assertVisible: "Colmena Colmena 01.*"
- tapOn: { id: "inspection-notes" }
- inputText: Observacion QA persistente de Colmena 01
- hideKeyboard
- scrollUntilVisible:
    element: { id: "inspection-save" }
- tapOn: { id: "inspection-save" }
- scrollUntilVisible:
    element: { text: "Guardada en la demo." }
- takeScreenshot: .artifacts/design/functional/03-observation-saved
# The header arrow: always on screen.
- tapOn: "Volver"
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- assertNotVisible: Observacion QA persistente de Colmena 01
- stopApp
- launchApp
- openLink: apisense:///
- scrollUntilVisible:
    element: { id: "login-demo" }
- tapOn: { id: "login-demo" }
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000101
- scrollUntilVisible:
    element: { text: "Observacion QA persistente de Colmena 01" }
- takeScreenshot: .artifacts/design/functional/07-observation-after-reopen
