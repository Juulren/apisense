appId: com.apisense.app
name: Observaciones y lecturas por colmena
---
- openLink: apisense:///
- scrollUntilVisible:
    element: { text: "Explorar demo local" }
- tapOn: "Explorar demo local"
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- openLink: apisense:///ui-catalog
- scrollUntilVisible:
    element: { text: "Claro" }
- tapOn: "Claro"
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000101
- scrollUntilVisible:
    direction: UP
    element: { text: "Anotar" }
- tapOn: "Anotar"
- assertVisible: "Observaciones de Colmena 01"
- tapOn: { id: "inspection-notes" }
- inputText: Observacion QA persistente de Colmena 01
- hideKeyboard
- scrollUntilVisible:
    element: { text: "Guardar observación" }
- tapOn: "Guardar observación"
- scrollUntilVisible:
    element: { text: "Observación de demo guardada localmente." }
- takeScreenshot: .artifacts/design/functional/03-observation-saved
- scrollUntilVisible:
    element: { text: "Volver" }
- tapOn: "Volver"
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000102
- assertNotVisible: Observacion QA persistente de Colmena 01
- stopApp
- launchApp
- openLink: apisense:///
- scrollUntilVisible:
    element: { text: "Explorar demo local" }
- tapOn: "Explorar demo local"
- extendedWaitUntil:
    visible: "Anotar"
    timeout: 60000
- openLink: apisense:///hive/00000000-0000-4000-8000-000000000101
- scrollUntilVisible:
    element: { text: "Observacion QA persistente de Colmena 01" }
- takeScreenshot: .artifacts/design/functional/07-observation-after-reopen
