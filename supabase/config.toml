project_id = "apisense"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "apisense://auth/callback"
additional_redirect_urls = ["apisense://auth/callback"]

[auth.email]
enable_confirmations = true
# Changing the password requires a recent sign-in, enforced by the server.
secure_password_change = true
otp_length = 8
otp_expiry = 3600

# Custom recovery email (code instead of link). The hosted project is on the free tier
# with the default email provider, which refuses template changes; enable this block
# after configuring a custom SMTP provider, then run `supabase config push`.
# The recovery email carries the emailed code (8 digits) the app asks for.
# [auth.email.template.recovery]
# subject = "Tu código para recuperar la contraseña de Apisense"
# content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.generate-hive-summary]
verify_jwt = false

# LoRaWAN uplinks come from The Things Stack, not from a signed-in user: the
# function authenticates them with a shared secret (LORA_UPLINK_SECRET).
[functions.lora-uplink]
verify_jwt = false

# Called by a signed-in user; the function validates the token itself and asks
# for the password again before deleting anything.
[functions.delete-account]
verify_jwt = false

# Called every minute by pg_cron with the shared cron secret (x-cron-secret).
[functions.send-push]
verify_jwt = false
