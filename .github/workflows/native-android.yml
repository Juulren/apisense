name: Android development
on:
  workflow_call:
    inputs:
      live_checks:
        type: boolean
        default: false
      design_checks:
        type: boolean
        default: false
      artifact_run_id:
        type: string
        default: ""
    secrets:
      APISENSE_NATIVE_QA_A_EMAIL:
        required: false
      APISENSE_NATIVE_QA_A_PASSWORD:
        required: false
      APISENSE_NATIVE_QA_B_EMAIL:
        required: false
      APISENSE_NATIVE_QA_B_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      live_checks:
        description: Probar dos cuentas temporales preparadas previamente (sin credenciales de servidor)
        type: boolean
        default: false
      design_checks:
        description: Capturar pantallas claro/oscuro con datos sintéticos (sin acceso cloud)
        type: boolean
        default: false
      artifact_run_id:
        description: Repetir el recorrido sobre un APK anterior (registra su SHA original)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: android-development-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "1"
  EXPO_NO_DOTENV: "1"
  EXPO_PUBLIC_DEMO_ONLY: "0"
  EXPO_PUBLIC_SECURITY_QA: "0"
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.APISENSE_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.APISENSE_SUPABASE_PUBLIC_KEY }}
  MAESTRO_VERSION: cli-2.12.0
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate public field configuration
        run: npm run eas-build-pre-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.artifact_run_id == ''
        with:
          cache-read-only: false
      - run: npm ci
        if: inputs.artifact_run_id == ''
      - run: npx expo prebuild --platform android --no-install
        if: inputs.artifact_run_id == ''
      - name: Build standalone field APK
        if: inputs.artifact_run_id == ''
        run: |
          set -o pipefail
          mkdir -p .artifacts
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2 --console=plain -x lint -x test 2>&1 | tee ../.artifacts/android-field-build.log
          ./gradlew --stop
      - uses: actions/download-artifact@v4
        if: inputs.artifact_run_id != ''
        with:
          name: apisense-android-development
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/source-android
      - name: Prepare existing field APK
        if: inputs.artifact_run_id != ''
        run: |
          mkdir -p android/app/build/outputs/apk/release
          cp .artifacts/source-android/android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/
      - name: Record APK provenance
        env:
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts
          if [ -n "$SOURCE_RUN" ]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
            export APK_SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          else
            export APK_SOURCE_SHA="$GITHUB_SHA"
          fi
          python3 -c 'import json,os; json.dump({"apk_source_sha": os.environ["APK_SOURCE_SHA"], "flow_source_sha": os.environ["GITHUB_SHA"], "reused_from_run": os.environ["SOURCE_RUN"] or None}, open(".artifacts/android-field-provenance.json", "w"))'
      - name: Inspect packaged Android policy
        run: |
          ANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -1)
          "$ANALYZER" manifest print android/app/build/outputs/apk/release/app-release.apk > .artifacts/android-field-manifest.xml
          python3 scripts/verify-native-policy.py android .artifacts/android-field-manifest.xml com.apisense.app
          sha256sum android/app/build/outputs/apk/release/app-release.apk > .artifacts/android-field-apk.sha256
      - name: Install Maestro
        if: inputs.live_checks || inputs.design_checks
        run: bash scripts/install-maestro.sh
      - name: Enable KVM
        if: inputs.live_checks || inputs.design_checks
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: inputs.live_checks || inputs.design_checks
        env:
          MAESTRO_QA_A_EMAIL: ${{ secrets.APISENSE_NATIVE_QA_A_EMAIL }}
          MAESTRO_QA_A_PASSWORD: ${{ secrets.APISENSE_NATIVE_QA_A_PASSWORD }}
          MAESTRO_QA_B_EMAIL: ${{ secrets.APISENSE_NATIVE_QA_B_EMAIL }}
          MAESTRO_QA_B_PASSWORD: ${{ secrets.APISENSE_NATIVE_QA_B_PASSWORD }}
          MAESTRO_QA_NOTE: ${{ vars.APISENSE_NATIVE_QA_NOTE }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ${{ inputs.live_checks && 'bash scripts/test-field-android.sh' || 'true' }}
            ${{ inputs.design_checks && 'bash scripts/test-design-android.sh' || 'true' }}
      - name: Redact temporary account credentials from reports
        if: always() && inputs.live_checks
        env:
          MAESTRO_QA_A_EMAIL: ${{ secrets.APISENSE_NATIVE_QA_A_EMAIL }}
          MAESTRO_QA_A_PASSWORD: ${{ secrets.APISENSE_NATIVE_QA_A_PASSWORD }}
          MAESTRO_QA_B_EMAIL: ${{ secrets.APISENSE_NATIVE_QA_B_EMAIL }}
          MAESTRO_QA_B_PASSWORD: ${{ secrets.APISENSE_NATIVE_QA_B_PASSWORD }}
        run: node scripts/redact-native-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apisense-android-development
          path: |
            android/app/build/outputs/apk/release/*.apk
            .artifacts/*.log
            .artifacts/*.xml
            .artifacts/*.json
            .artifacts/*.png
            .artifacts/*.sha256
            .artifacts/android-field-maestro/
            .artifacts/android-field-maestro-retry/
            .artifacts/android-field-offline-maestro/
            .artifacts/android-field-offline-maestro-retry/
            .artifacts/android-field-sync-maestro/
            .artifacts/android-field-sync-maestro-retry/
            .artifacts/design/
          retention-days: 14
          include-hidden-files: true
