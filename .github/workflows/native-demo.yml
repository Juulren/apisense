name: Native demo
on:
  push:
    branches: [codex/native-demo]
    paths:
      - "src/**"
      - "scripts/**"
      - ".maestro/**"
      - ".github/workflows/native-demo.yml"
      - "app.config.js"
      - "app.json"
      - "package*.json"
      - "*.config.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-demo-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  EXPO_NO_DOTENV: "1"
  EXPO_PUBLIC_DEMO_ONLY: "1"
  MAESTRO_VERSION: cli-2.12.0
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone demo APK
        run: |
          set -o pipefail
          mkdir -p .artifacts
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2 --console=plain -x lint -x test 2>&1 | tee ../.artifacts/android-build.log
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell svc wifi disable
            adb shell svc data disable
            "$HOME/.maestro/bin/maestro" test --format junit --output .artifacts/android-demo.xml .maestro/demo.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apisense-demo-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            .artifacts/
          retention-days: 14
          include-hidden-files: true
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: xcodebuild -version
      - run: npx expo prebuild --platform ios --no-install
      - name: Install native pods
        run: pod install --project-directory=ios
      - name: Build standalone simulator app
        run: |
          mkdir -p .artifacts
          set -o pipefail
          xcodebuild -workspace ios/ApisenseDemo.xcworkspace -scheme ApisenseDemo -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .artifacts/ios-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .artifacts/ios-build.log
          ditto -c -k --sequesterRsrc --keepParent .artifacts/ios-build/Build/Products/Release-iphonesimulator/ApisenseDemo.app .artifacts/ApisenseDemo-simulator.zip
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Run demo in iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" .artifacts/ios-build/Build/Products/Release-iphonesimulator/ApisenseDemo.app
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" test --format junit --output .artifacts/ios-demo.xml .maestro/demo.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apisense-demo-ios-simulator
          path: |
            .artifacts/ApisenseDemo-simulator.zip
            .artifacts/*.log
            .artifacts/*.xml
            .artifacts/*.png
          retention-days: 14
          include-hidden-files: true
